spring.application.name=ms-communities
server.port=${COMMUNITIES_PORT:8086}
spring.datasource.url=${COMMUNITIES_DB_URL:jdbc:mysql://localhost:3306/instalert_communities}
spring.datasource.username=${COMMUNITIES_DB_USER}
spring.datasource.password=${COMMUNITIES_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
app.cors.origins=${COMMUNITIES_CORS_ORIGINS:http://localhost:4200,http://localhost:4201}
notifications.internal-key=${NOTIFICATIONS_INTERNAL_KEY:}
emergencies.service.url=${EMERGENCIES_SERVICE_URL:http://localhost:8083}
evidence.storage.path=${INCIDENTS_EVIDENCE_PATH:./target/evidence}
server.error.include-message=never
